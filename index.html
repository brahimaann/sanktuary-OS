<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sanktuary OS</title>
    <link rel="icon" href="/icons/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sanktuary" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- viewport-fit=cover + black-translucent: the screen runs under the status bar and home indicator; src/styles/classic.css keeps the controls inside the safe area -->
    <link rel="stylesheet" href="/font/fixedsys-excelsior/fsex300.css" />
    <!-- Warm the CITIES magazine (cover + flip library) while the desktop idles, so opening it is instant -->
    <link rel="prefetch" href="/magazine/pages/cover.webp" />
    <link rel="prefetch" href="/magazine/page-flip.js" />
    <link rel="stylesheet" href="/lib/os-gui/layout.css" />
    <link rel="stylesheet" href="/lib/os-gui/windows-98.css" />
  </head>
  <body class="desktop">
    <!-- Dark by default, White as an option (src/utils/theme.ts). Set before paint so there's no white flash. -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('sk:theme') === 'white' ? 'white' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Browsers without modules (Internet Explorer) would stay blank: send them to the script-free Sanktuary Lite -->
    <script nomodule>
      location.replace('/lite');
    </script>
  </body>
</html>
