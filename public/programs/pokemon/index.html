<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon Crystal GBC</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
      }
      #game {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      EJS_player = '#game';
      EJS_core = 'gambatte';
      EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      EJS_gameUrl = '/programs/pokemon/rom.gbc';
      EJS_startOnLoaded = true;
      
      EJS_defaultControls = {
        0: {
          24: { 'value': 's', 'value2': '' },
          25: { 'value': 'l', 'value2': '' }
        },
        1: {},
        2: {},
        3: {}
      };
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
  </body>
</html>
