<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Winamp</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
    }
    #app {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="lib/webamp.bundle.min.js"></script>
  <script>
    const Webamp = window.Webamp;
    if (Webamp && Webamp.browserIsSupported()) {
      const webamp = new Webamp({
        initialTracks: [
          {
            metaData: {
              artist: "DJ Mike Llama",
              title: "Llama Whippin' Intro"
            },
            url: "mp3/llama-2.91.mp3",
            duration: 5.32
          }
        ],
        initialSkin: {
          url: "skins/base-2.91.wsz"
        },
        zIndex: 1
      });

      webamp.renderWhenReady(document.getElementById("app"));

      window.addEventListener("message", function(e) {
        if (e.data && e.data.type === "ADD_TRACK" && e.data.track) {
          webamp.appendTracks([e.data.track]);
        }
      });
    } else {
      document.body.innerHTML = "<div style='color:#fff;padding:20px;font-family:monospace;'>Winamp could not be initialized.</div>";
    }
  </script>
</body>
</html>
