<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background: Globe -->
  <circle cx="16" cy="14" r="11" fill="#000080" stroke="#808080" stroke-width="1"/>
  <circle cx="16" cy="14" r="11" fill="none" stroke="#c0c0c0" stroke-width="0.5"/>
  <!-- Latitude lines -->
  <ellipse cx="16" cy="14" rx="11" ry="4" fill="none" stroke="#4040a0" stroke-width="0.7"/>
  <ellipse cx="16" cy="14" rx="11" ry="8" fill="none" stroke="#4040a0" stroke-width="0.5"/>
  <!-- Longitude line -->
  <ellipse cx="16" cy="14" rx="4" ry="11" fill="none" stroke="#4040a0" stroke-width="0.7"/>
  <!-- Africa shape (simplified) -->
  <path d="M18,7 L20,8 21,10 21,13 20,16 19,19 17,21 15,22 14,20 13,17 13,14 14,11 15,9 17,7 Z" fill="#c44020" stroke="#ff8060" stroke-width="0.5"/>
  <!-- Americas hint -->
  <path d="M8,8 L10,7 11,9 11,12 10,15 9,18 8,17 7,14 7,11 Z" fill="#20884a" stroke="#60c080" stroke-width="0.5"/>
  <!-- Raised fist -->
  <g transform="translate(13,20)">
    <rect x="1" y="0" width="5" height="3" rx="0.5" fill="#daa520" stroke="#8b6914" stroke-width="0.5"/>
    <rect x="1" y="-4" width="5" height="5" rx="1" fill="#daa520" stroke="#8b6914" stroke-width="0.5"/>
    <rect x="1.5" y="-6" width="1.2" height="3" rx="0.3" fill="#daa520"/>
    <rect x="3" y="-7" width="1.2" height="4" rx="0.3" fill="#daa520"/>
    <rect x="4.5" y="-6" width="1.2" height="3" rx="0.3" fill="#daa520"/>
  </g>
  <!-- Highlight -->
  <circle cx="12" cy="10" r="3" fill="white" opacity="0.1"/>
</svg>
