<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--meta-->
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        --face: #c0c0c0;
        --navy: #000080;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #008080;
        font-family: 'MS Sans Serif', Tahoma, Arial, sans-serif;
        font-size: 13px;
        color: #000;
        display: flex;
        justify-content: center;
        padding: 24px 12px;
      }
      .wrap {
        width: min(820px, 100%);
      }
      .win {
        background: var(--face);
        border: 2px solid;
        border-color: #fff #000 #000 #fff;
        box-shadow: 1px 1px 0 #000;
      }
      .title {
        background: linear-gradient(90deg, var(--navy), #1084d0);
        color: #fff;
        font-weight: 700;
        padding: 4px 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .title img {
        width: 16px;
        height: 16px;
      }
      .title a {
        color: #fff;
        text-decoration: none;
      }
      .bar {
        display: flex;
        gap: 6px;
        padding: 6px;
        border-bottom: 1px solid #808080;
        align-items: center;
        flex-wrap: wrap;
      }
      .body {
        padding: 10px;
      }
      .btn {
        font: inherit;
        padding: 4px 12px;
        min-height: 28px;
        background: var(--face);
        color: #000;
        text-decoration: none;
        border: 1px solid;
        border-color: #fff #000 #000 #fff;
        box-shadow: inset -1px -1px #808080;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn.on {
        border-color: #000 #fff #fff #000;
        box-shadow: inset 1px 1px #808080;
        background: #d4d4d4;
      }
      .post {
        display: flex;
        gap: 12px;
        background: #fff;
        border: 2px solid;
        border-color: #808080 #fff #fff #808080;
        padding: 10px;
        margin-bottom: 10px;
        cursor: pointer;
        color: inherit;
        text-decoration: none;
      }
      .post:hover {
        background: #f0f0ff;
      }
      .post img {
        width: 132px;
        height: 96px;
        object-fit: cover;
        flex-shrink: 0;
        border: 1px solid #808080;
      }
      .post h2 {
        font:
          700 16px Georgia,
          serif;
        margin: 0 0 4px;
      }
      .meta {
        color: #555;
        font-size: 11px;
        margin-bottom: 4px;
      }
      .chip {
        color: #fff;
        font-size: 10px;
        padding: 0 5px;
        margin-right: 4px;
      }
      .excerpt {
        font:
          14px/1.45 Georgia,
          serif;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
      }
      .reader {
        background: #fff;
        border: 2px solid;
        border-color: #808080 #fff #fff #808080;
        padding: 20px min(40px, 5vw);
        font:
          16px/1.65 Georgia,
          serif;
      }
      .reader h1 {
        font:
          700 26px/1.25 Georgia,
          serif;
        margin: 0 0 6px;
      }
      .reader img.cover {
        width: 100%;
        max-height: 420px;
        object-fit: cover;
        margin: 12px 0;
        border: 1px solid #808080;
      }
      .reader p {
        margin: 0 0 14px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .content img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 12px auto;
      }
      .content blockquote {
        margin: 0 0 14px;
        padding: 4px 14px;
        border-left: 4px solid var(--navy);
        color: #333;
      }
      .content figcaption {
        font-size: 13px;
        color: #555;
        text-align: center;
      }
      .content h2,
      .content h3 {
        font-family: Georgia, serif;
        margin: 22px 0 8px;
      }
      .content a {
        color: var(--navy);
      }
      .credit {
        margin-top: 24px;
        padding-top: 12px;
        border-top: 1px solid #ccc;
        font:
          13px Tahoma,
          Arial,
          sans-serif;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .empty {
        background: #fff;
        padding: 16px;
        border: 2px solid;
        border-color: #808080 #fff #fff #808080;
      }
      .foot {
        color: #fff;
        text-align: center;
        margin-top: 10px;
        font-size: 11px;
        opacity: 0.85;
      }
      .foot a {
        color: #fff;
      }
      /* Notes wall: TheSlap-style status boxes, each a little window in its writer's colour */
      .wall {
        margin: -10px;
        padding: 12px;
        background:
          radial-gradient(circle, rgba(255, 255, 255, 0.35) 2px, transparent 2.5px) 0 0 / 18px 18px,
          #3a1c71;
        min-height: 300px;
      }
      .note {
        background: #fff;
        border: 2px solid;
        border-color: #fff #000 #000 #fff;
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.45);
        margin: 0 auto 14px;
        max-width: 620px;
      }
      .note .hd {
        color: #fff;
        font-weight: 700;
        padding: 3px 6px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .note .hd img {
        width: 32px;
        height: 32px;
        border: 2px solid #fff;
        object-fit: cover;
        background: #fff;
      }
      .note .hd .ago {
        margin-left: auto;
        font-weight: 400;
        font-size: 11px;
      }
      .note .txt {
        padding: 10px 12px;
        font:
          15px/1.5 Georgia,
          serif;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .note .txt p {
        margin: 0 0 8px;
      }
      .note .txt.long {
        max-height: 15em;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(#000 70%, transparent);
        mask-image: linear-gradient(#000 70%, transparent);
      }
      .note .txt a,
      .note .ft a {
        color: var(--navy);
      }
      .note .pics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 4px;
        padding: 0 12px 10px;
      }
      .note .pics img {
        width: 100%;
        max-height: 360px;
        object-fit: cover;
        border: 1px solid #808080;
      }
      .note .ft {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 4px 12px 6px;
        border-top: 1px solid #ddd;
        font-size: 12px;
        color: #444;
        flex-wrap: wrap;
      }
      .note .ft .btn {
        margin-left: auto;
        min-height: 24px;
        padding: 2px 8px;
      }
      /* CITIES: section tabs, the preface, field-note photos, the Listen card and the video wall */
      .tabs {
        display: flex;
        gap: 4px;
        padding: 6px 6px 0;
        flex-wrap: wrap;
      }
      .tabs .btn {
        font-weight: 700;
      }
      .preface {
        font:
          italic 18px/1.45 Georgia,
          serif;
        color: #333;
        margin: 0 0 10px;
      }
      .reader img.photo {
        width: 100%;
        margin: 6px 0 14px;
        border: 1px solid #808080;
      }
      .listen {
        margin-top: 22px;
        padding: 12px;
        background: #f4f4f4;
        border: 2px solid;
        border-color: #fff #808080 #808080 #fff;
        font:
          13px Tahoma,
          Arial,
          sans-serif;
      }
      .listen .head {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 8px;
      }
      .listen .head img {
        width: 72px;
        height: 72px;
        object-fit: cover;
        border: 1px solid #808080;
      }
      .listen .stores {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .listen ol {
        margin: 0;
        padding-left: 22px;
      }
      .listen li {
        padding: 3px 0;
      }
      .listen li a {
        color: var(--navy);
        margin-left: 8px;
        font-size: 12px;
      }
      .moodwall {
        column-width: 220px;
        column-gap: 10px;
      }
      .drop {
        break-inside: avoid;
        margin-bottom: 10px;
        background: #fff;
        border: 1px solid #808080;
      }
      .drop img,
      .drop video {
        display: block;
        width: 100%;
      }
      .words {
        padding: 12px;
        font-size: 15px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .song {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px;
        color: #000;
        text-decoration: none;
      }
      .song audio {
        width: 100%;
      }
      .reacts {
        display: flex;
        border-top: 1px solid #c0c0c0;
      }
      .reacts button {
        flex: 1;
        font: inherit;
        padding: 4px 0;
        background: none;
        border: 0;
        cursor: pointer;
        filter: grayscale(0.7);
      }
      .reacts button.on {
        filter: none;
        background: #ffffe1;
      }
      .shuffle {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: #000;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px;
        user-select: none;
      }
      .shuffle .stage {
        max-width: min(900px, 100%);
        max-height: 75vh;
        display: flex;
        justify-content: center;
      }
      .shuffle img,
      .shuffle video {
        max-width: 100%;
        max-height: 75vh;
        object-fit: contain;
      }
      .shuffle .words {
        font-size: clamp(18px, 4vw, 32px);
        color: #000;
        max-width: 640px;
      }
      .shuffle .song {
        color: #fff;
        font-size: 18px;
        min-width: min(420px, 90vw);
      }
      .shuffle .reacts {
        border: 0;
        gap: 6px;
      }
      .shuffle .reacts button {
        font-size: 22px;
        color: #fff;
      }
      .shuffle .reacts button.on {
        background: #333;
      }
      .shuffle .x {
        position: absolute;
        top: 12px;
        right: 12px;
      }
      .videos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 10px;
      }
      .video {
        background: #fff;
        border: 2px solid;
        border-color: #808080 #fff #fff #808080;
        cursor: pointer;
      }
      .video img {
        width: 100%;
        aspect-ratio: 16/9;
        object-fit: cover;
        display: block;
      }
      .video div {
        padding: 6px 8px;
      }
      .player {
        position: relative;
        aspect-ratio: 16/9;
        background: #000;
        margin-bottom: 10px;
      }
      .player iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      /* Heart of the Cities: the people CITIES has interviewed, each with a page of their own */
      .people {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 8px;
        margin-bottom: 10px;
      }
      .face {
        background: #fff;
        border: 2px solid;
        border-color: #808080 #fff #fff #808080;
        color: inherit;
        text-decoration: none;
        font:
          13px Tahoma,
          Arial,
          sans-serif;
      }
      .face:hover {
        background: #f0f0ff;
      }
      .face img,
      .face .blank {
        display: block;
        width: 100%;
        aspect-ratio: 4/5;
        object-fit: cover;
        background: #ddd;
      }
      .face > div {
        padding: 4px 6px;
      }
      .face .meta {
        margin: 0;
      }
      .portraits {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 6px;
        margin: 12px 0;
      }
      .portraits img {
        width: 100%;
        aspect-ratio: 4/5;
        object-fit: cover;
        border: 1px solid #808080;
      }
      .portraits img:first-child {
        grid-column: 1 / -1;
        aspect-ratio: auto;
        max-height: 560px;
      }
      .info {
        font:
          14px/1.5 Tahoma,
          Arial,
          sans-serif;
        background: #f4f4f4;
        border: 2px solid;
        border-color: #fff #808080 #808080 #fff;
        padding: 10px 12px;
        margin-bottom: 16px;
      }
      .info p {
        margin: 0 0 8px;
      }
      .info a {
        color: var(--navy);
        margin-right: 10px;
      }
      .reader h3 {
        font:
          700 13px Tahoma,
          Arial,
          sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #555;
        margin: 22px 0 8px;
      }
      @media (max-width: 520px) {
        .post {
          flex-direction: column;
        }
        .post img {
          width: 100%;
          height: 160px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="win">
        <div class="title"><img src="/images/icons/news-32x32.png" alt="" /><a href="/cities" data-nav>CITIES</a></div>
        <div class="tabs" id="tabs"></div>
        <div class="bar" id="bar"></div>
        <div class="body" id="app">Loading...</div>
      </div>
      <div class="foot"><a href="/">Enter Sanktuary</a> · <a href="/write">Write for CITIES</a> (members) · sanktuary.studio</div>
    </div>
    <script>
      const app = document.getElementById('app');
      const bar = document.getElementById('bar');
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
      const when = (d) => new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      let all = [];
      let filter = '';
      const tabsEl = document.getElementById('tabs');
      // The sections of CITIES: Heart of the Cities is the main one and the front page
      const SECTIONS = [
        ['heart', 'Heart of the Cities'],
        ['essays', 'Essays'],
        ['field-notes', 'Field Notes'],
        ['videos', 'Videos'],
        ['moodboard', 'Moodboard'],
      ];
      const KINDS = { profile: 'Profile', 'case-study': 'Case study', spotlight: 'Spotlight' };
      const LINE_CHIP = { heart: ['#b00020', 'Heart'], essays: ['#000080', 'Essay'], 'field-notes': ['#2e7d32', 'Field note'] };
      const go = (href) => (history.pushState(null, '', href), route());
      function sectionTabs(on) {
        tabsEl.innerHTML = SECTIONS.map(
          ([k, name]) => `<a class="btn ${on === k ? 'on' : ''}" href="${k === 'heart' ? '/cities' : '/cities/' + k}" data-nav>${name}</a>`,
        ).join('');
      }
      const chip = (p) => {
        const [bg, label] = p.source === 'substack' ? ['#ff6719', 'Substack'] : LINE_CHIP[p.line] || LINE_CHIP.heart;
        return `<span class="chip" style="background:${bg}">${p.kind && KINDS[p.kind] ? KINDS[p.kind] : label}</span>`;
      };

      function list(section) {
        sectionTabs(section);
        const inSection = all.filter((p) => (p.line || 'heart') === section);
        if (section === 'essays') {
          const writers = [...new Set(inSection.map((p) => p.publication))];
          bar.innerHTML =
            subTabs('posts') +
            (writers.length > 1
              ? `<button class="btn ${filter ? '' : 'on'}" data-f="">All</button>` +
                writers.map((w) => `<button class="btn ${filter === w ? 'on' : ''}" data-f="${esc(w)}">${esc(w)}</button>`).join('')
              : '');
          bar.querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => ((filter = b.dataset.f), list(section))));
        } else
          bar.innerHTML = `<span>${{ heart: 'Profiles, case studies and spotlights from the Twin Cities arts scene.', 'field-notes': 'Straight from the field: shoots, sessions and shows.' }[section]}</span>`;
        const shown = inSection.filter((p) => section !== 'essays' || !filter || p.publication === filter);
        const faces = section === 'heart' && people.length ? `<div class="people">${people.map(face).join('')}</div>` : '';
        // Heart of the Cities opens with the magazine
        const magazine =
          section === 'heart'
            ? `<a class="post" href="/magazine"><img src="/magazine/pages/cover.webp" alt="" loading="lazy">
                <div style="min-width:0"><div class="meta"><span class="chip" style="background:#b00020">Magazine</span>CITIES</div>
                <h2>CITIES Vol. 1</h2><div class="excerpt">The magazine: Twin Cities artists in their own words. Flip through the issue.</div></div></a>`
            : '';
        app.innerHTML =
          magazine +
            faces +
            shown
              .map(
                (p) => `<a class="post" href="${esc(p.url)}" data-nav>
                    ${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}
                    <div style="min-width:0">
                      <div class="meta">${chip(p)}${esc(p.publication)}${p.author && p.author !== p.publication ? ' · ' + esc(p.author) : ''} · ${when(p.date)}</div>
                      <h2>${esc(p.title)}</h2>
                      <div class="excerpt">${esc(p.excerpt)}</div>
                    </div></a>`,
              )
              .join('') || '<div class="empty">Nothing here yet. Check back soon.</div>';
      }

      // Our own posts are plain text: paragraphs, https links made clickable, and a line that is just one of our
      // uploaded pictures (/api/blog/images/...) shown as a photo. Nothing else is interpreted.
      const body = (t) =>
        String(t || '')
          .split(/\n{2,}/)
          .map((para) =>
            /^\/api\/blog\/images\/[\w-]+\.webp$/.test(para.trim())
              ? `<img class="photo" src="${esc(para.trim())}" alt="" loading="lazy">`
              : `<p>${esc(para).replace(/https:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`)}</p>`,
          )
          .join('');

      // A release's streaming links, the album's and each song's, so readers go and listen where they already do
      const STORE_NAMES = {
        spotify: 'Spotify',
        appleMusic: 'Apple Music',
        youtubeMusic: 'YouTube Music',
        tidal: 'Tidal',
        amazonMusic: 'Amazon Music',
        deezer: 'Deezer',
        soundcloud: 'SoundCloud',
        bandcamp: 'Bandcamp',
        audiomack: 'Audiomack',
      };
      const outLink = (href, text, cls = '') =>
        `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>`;
      async function listen(slug) {
        const r = await fetch(`/api/public/release/${encodeURIComponent(slug)}`).catch(() => null);
        if (!r?.ok) return '';
        const rel = await r.json();
        const upcoming = rel.date && rel.date > new Date().toLocaleDateString('en-CA');
        const stores = Object.entries(rel.stores || {}).filter(([k]) => (upcoming ? k === 'presave' : k in STORE_NAMES));
        const songs = rel.tracks
          .map((t) => {
            const links = Object.entries(t.links || {}).filter(([k]) => k in STORE_NAMES);
            return `<li><b>${esc(t.title)}</b>${links.map(([k, u]) => outLink(u, STORE_NAMES[k])).join('')}</li>`;
          })
          .join('');
        return `<div class="listen"><div class="head">${rel.cover ? `<img src="/api/public/release/${esc(rel.slug)}/cover?w=400" alt="">` : ''}<div><div class="meta">Listen</div><b style="font-size:15px">${esc(rel.title)}</b>${rel.artist ? ` · ${esc(rel.artist)}` : ''}<div><a href="/release/${esc(rel.slug)}" target="_blank">Open the release page</a></div></div></div>
          ${stores.length ? `<div class="stores">${stores.map(([k, u]) => outLink(u, k === 'presave' ? 'Pre-save' : STORE_NAMES[k], 'btn')).join('')}</div>` : ''}
          ${songs ? `<ol>${songs}</ol>` : ''}</div>`;
      }

      let people = [];
      const face = (x) =>
        `<a class="face" href="${esc(x.url)}" data-nav>${x.portrait ? `<img src="${esc(x.portrait)}" alt="" loading="lazy">` : '<span class="blank"></span>'}<div><b>${esc(x.name)}</b>${x.role ? `<div class="meta">${esc(x.role)}</div>` : ''}</div></a>`;

      // An interview subject's page: portraits, who they are, the interview or a note, and the stories they're in
      async function person(slug) {
        sectionTabs('heart');
        bar.innerHTML = '<a class="btn" href="/cities" data-nav>&larr; Heart of the Cities</a>';
        app.textContent = 'Loading...';
        const r = await fetch(`/api/blog/people/${encodeURIComponent(slug)}`).catch(() => null);
        if (!r?.ok) return (app.innerHTML = '<div class="empty">This page is not available.</div>');
        const x = await r.json();
        document.title = `${x.name} · CITIES`;
        const host = (u) => new URL(u).hostname.replace(/^www\./, '');
        app.innerHTML = `<article class="reader"><div class="meta"><span class="chip" style="background:#b00020">Heart of the Cities</span></div><h1>${esc(x.name)}</h1>${x.role ? `<p class="preface">${esc(x.role)}</p>` : ''}
          ${x.portraits.length ? `<div class="portraits">${x.portraits.map((u) => `<img src="${esc(u)}" alt="${esc(x.name)}" loading="lazy">`).join('')}</div>` : ''}
          ${x.info || x.links.length ? `<div class="info">${x.info ? body(x.info) : ''}${x.links.length ? `<div>${x.links.map((u) => outLink(u, host(u))).join('')}</div>` : ''}</div>` : ''}
          ${x.note ? `<div class="content">${body(x.note)}</div>` : ''}
          ${x.stories.length ? `<h3>In CITIES</h3>${x.stories.map((p) => `<a class="post" href="${esc(p.url)}" data-nav>${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : ''}<div style="min-width:0"><div class="meta">${chip(p)}${when(p.date)}</div><h2>${esc(p.title)}</h2><div class="excerpt">${esc(p.excerpt)}</div></div></a>`).join('')}` : ''}
        </article>`;
        scrollTo(0, 0);
      }

      // A Shop item featured in the post: buy it without hunting for it in the shop
      async function shopCard(slug) {
        const r = await fetch('/api/shop').catch(() => null);
        const x = r?.ok && (await r.json()).products.find((p) => p.slug === slug);
        if (!x) return '';
        const price = Number(x.price).toLocaleString(undefined, { style: 'currency', currency: 'USD' });
        return `<div class="listen"><div class="head">${x.image ? `<img src="${esc(x.image)}" alt="">` : ''}<div><div class="meta">In this story</div><b style="font-size:15px">${esc(x.title)}</b> · ${x.soldOut || x.vault ? 'Sold out' : esc(price)}
          <div><a class="btn" href="/shop/${esc(x.slug)}">${x.soldOut || x.vault ? 'See it in the shop' : 'Buy it'}</a></div></div></div></div>`;
      }

      async function read(id) {
        const back = id.includes('/') ? '/cities/essays' : '/cities';
        bar.innerHTML = `<a class="btn" href="${back}" data-nav>&larr; Back</a>`;
        app.textContent = 'Loading...';
        const r = await fetch(`/api/blog/post/${id.split('/').map(encodeURIComponent).join('/')}`);
        if (!r.ok) return (sectionTabs(''), (app.innerHTML = '<div class="empty">This post is not available.</div>'));
        const p = await r.json();
        sectionTabs(p.line || 'heart');
        if ((p.line || 'heart') !== 'heart') bar.innerHTML = `<a class="btn" href="/cities/${p.line}" data-nav>&larr; Back</a>`;
        document.title = `${p.title} · CITIES`;
        // Substack posts arrive already cleaned by the server (plain formatting only); ours are plain text
        const credit = p.external
          ? `<div class="credit">Originally published by <b>${esc(p.publication)}</b> on Substack. <a class="btn" href="${esc(p.external)}" target="_blank" rel="noopener noreferrer">Comment or subscribe on Substack</a></div>`
          : '';
        app.innerHTML = `<article class="reader"><div class="meta">${chip(p)}</div><h1>${esc(p.title)}</h1>${p.preface ? `<p class="preface">${esc(p.preface)}</p>` : ''}<div class="meta">${esc(p.publication)}${p.author && p.author !== p.publication ? ' · ' + esc(p.author) : ''} · ${when(p.date)}</div>
                ${p.image && !(p.html || '').includes(p.image) ? `<img class="cover" src="${esc(p.image)}" alt="" referrerpolicy="no-referrer">` : ''}${p.html != null ? `<div class="content">${p.html}</div>` : body(p.body)}${p.people?.length ? `<h3>People in this story</h3><div class="people">${p.people.map(face).join('')}</div>` : ''}<div id="listen"></div><div id="shop"></div>${credit}</article>`;
        scrollTo(0, 0);
        if (p.release) document.getElementById('listen').outerHTML = await listen(p.release);
        if (p.product) document.getElementById('shop').outerHTML = await shopCard(p.product);
      }

      // The moodboard of the month: whatever the team dropped on its board this month, as a wall sorted into four
      // moods. Visitors filter by mood, play clips and songs, react, or hit Shuffle to watch it full screen.
      const MOODS = [
        ['hype', '🔥', 'Hype'],
        ['cool', '😎', 'Cool'],
        ['sad', '😢', 'Sad'],
        ['beautiful', '✨', 'Beautiful'],
      ];
      let allMonths = null;
      let mood = null; // { month, drops, ... } on screen
      let moodFilter = '';
      const monthName = (m) => new Date(`${m}-15`).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
      const tapped = (id, k) => {
        try {
          return localStorage.getItem(`sk_mood_${id}_${k}`);
        } catch {}
      };
      function dropBody(d, big) {
        if (d.kind === 'image') return `<img src="${esc(d.src)}" alt="${esc(d.name || '')}" loading="lazy">`;
        if (d.kind === 'video')
          return `<video src="${esc(d.src)}" controls playsinline preload="metadata" ${big ? 'autoplay' : ''}></video>`;
        if (d.kind === 'audio')
          return `<div class="song"><b>♪ ${esc(d.name || 'Track')}</b><audio src="${esc(d.src)}" controls preload="none" ${big ? 'autoplay' : ''}></audio></div>`;
        if (d.kind === 'link')
          return `<a class="song" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer"><b>${esc(d.name || d.text || new URL(d.url).hostname)}</b><span>${esc(new URL(d.url).hostname)} &nearr;</span></a>`;
        return `<div class="words" style="background:${esc(d.color || '#fff')}">${esc(d.text)}</div>`;
      }
      const reactBar = (d) =>
        `<div class="reacts">${MOODS.map(([k, e]) => `<button class="${tapped(d.id, k) ? 'on' : ''}" data-r="${k}" data-id="${d.id}" title="${k}">${e} <span>${d.reactions[k] || ''}</span></button>`).join('')}</div>`;
      async function react(btn) {
        const { id, r } = btn.dataset;
        if (tapped(id, r)) return;
        try {
          localStorage.setItem(`sk_mood_${id}_${r}`, '1');
        } catch {}
        btn.classList.add('on');
        const d = mood.drops.find((x) => x.id === id);
        d.reactions[r] = (d.reactions[r] || 0) + 1;
        btn.querySelector('span').textContent = d.reactions[r];
        fetch(`/api/blog/moodboards/${mood.month}`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ item: id, mood: r }),
        }).catch(() => {});
      }
      async function moodboard(month) {
        sectionTabs('moodboard');
        try {
          allMonths ??= (await (await fetch('/api/blog/moodboards')).json()).months;
          month ||= allMonths[0]?.month;
          if (month && mood?.month !== month) {
            app.textContent = 'Loading...';
            const r = await fetch(`/api/blog/moodboards/${month}`);
            mood = r.ok ? await r.json() : null;
          }
        } catch {
          app.innerHTML = '<div class="empty">The moodboard could not load. Try again in a minute.</div>';
          return;
        }
        const i = allMonths.findIndex((m) => m.month === month);
        if (!mood || i < 0) {
          document.title = 'Moodboard · CITIES';
          bar.innerHTML = allMonths.length ? '<a class="btn" href="/cities/moodboard" data-nav>This month</a>' : '';
          app.innerHTML = `<div class="empty">${allMonths.length ? 'There is no moodboard for that month.' : 'The first moodboard is on its way. Check back soon.'}</div>`;
          return;
        }
        document.title = `${monthName(month)} Moodboard · CITIES`;
        const older = allMonths[i + 1];
        const newer = allMonths[i - 1];
        bar.innerHTML =
          `${older ? `<a class="btn" href="/cities/moodboard/${older.month}" data-nav>&larr; ${esc(monthName(older.month))}</a>` : ''}` +
          `<select class="btn" id="month" aria-label="Month">${allMonths.map((x) => `<option value="${x.month}" ${x.month === month ? 'selected' : ''}>${esc(monthName(x.month))}</option>`).join('')}</select>` +
          `${newer ? `<a class="btn" href="/cities/moodboard/${newer.month}" data-nav>${esc(monthName(newer.month))} &rarr;</a>` : ''}` +
          `<span style="flex:1"></span><button class="btn" id="shuffle"><b>&#9654; Shuffle</b></button>`;
        bar.querySelector('#month').onchange = (e) => go(`/cities/moodboard/${e.target.value}`);
        bar.querySelector('#shuffle').onclick = shuffle;
        const count = (k) => mood.drops.filter((d) => !k || d.mood === k).length;
        const shown = mood.drops.filter((d) => !moodFilter || d.mood === moodFilter);
        app.innerHTML = `<h2 style="margin:0 0 4px">${esc(mood.name.includes(monthName(month)) ? mood.name : `${monthName(month)}: ${mood.name}`)}</h2>
          ${mood.note ? `<p style="margin:0 0 8px">${esc(mood.note)}</p>` : ''}
          <div class="bar" style="padding:0 0 8px;border:0">${[['', '', 'Everything'], ...MOODS]
            .map(([k, e, name]) => `<button class="btn ${moodFilter === k ? 'on' : ''}" data-m="${k}">${e} ${name} (${count(k)})</button>`)
            .join('')}</div>
          <div class="moodwall">${
            shown.map((d) => `<div class="drop">${dropBody(d)}${reactBar(d)}</div>`).join('') ||
            '<div class="empty">Nothing in this mood yet. The team is still dropping things in.</div>'
          }</div>
          <p style="font-size:11px;margin:8px 0 0">Tap a mood to react. <a href="${esc(mood.board)}" target="_blank" rel="noopener">See the whole board</a>, laid out the way the team made it.</p>`;
        app.querySelectorAll('[data-m]').forEach((b) => (b.onclick = () => ((moodFilter = b.dataset.m), moodboard(month))));
        app.querySelectorAll('[data-r]').forEach((b) => (b.onclick = () => react(b)));
      }
      // Shuffle: the month's drops full screen in random order. Pictures and words stay 6 seconds, clips and songs
      // play to the end. Tap the right side (or →) for next, the left (or ←) for back, Esc to leave.
      function shuffle() {
        const list = mood.drops.filter((d) => !moodFilter || d.mood === moodFilter).sort(() => Math.random() - 0.5);
        if (!list.length) return;
        const box = document.createElement('div');
        box.className = 'shuffle';
        document.body.appendChild(box);
        let n = 0;
        let timer;
        const show = () => {
          clearTimeout(timer);
          const d = list[(n = (n + list.length) % list.length)];
          const tag = MOODS.find(([k]) => k === d.mood);
          box.innerHTML = `<div class="stage">${dropBody(d, true)}</div><div class="cap">${tag ? `${tag[1]} ${tag[2]} · ` : ''}${n + 1} / ${list.length}</div>${reactBar(d)}<button class="btn x" aria-label="Close">&times;</button>`;
          box.querySelectorAll('[data-r]').forEach((b) => (b.onclick = (e) => (e.stopPropagation(), react(b))));
          box.querySelector('.x').onclick = (e) => (e.stopPropagation(), close());
          const media = box.querySelector('video,audio');
          if (media) media.onended = () => (n++, show());
          else timer = setTimeout(() => (n++, show()), 6000);
        };
        const key = (e) => (e.key === 'Escape' ? close() : e.key === 'ArrowRight' ? (n++, show()) : e.key === 'ArrowLeft' && (n--, show()));
        const close = () => (clearTimeout(timer), box.remove(), removeEventListener('keydown', key), moodboard(mood.month)); // fresh counts
        box.onclick = (e) => {
          if (e.target.closest('a,video,audio')) return;
          e.clientX > innerWidth / 2 ? n++ : n--;
          show();
        };
        addEventListener('keydown', key);
        show();
      }

      let allVideos = null;
      async function videos() {
        sectionTabs('videos');
        document.title = 'Videos · CITIES';
        bar.innerHTML = '<span>New videos from Twin Cities creators, as they post them.</span>';
        if (!allVideos) {
          app.textContent = 'Loading...';
          allVideos = await fetch('/api/blog/videos')
            .then((r) => r.json())
            .then((d) => d.videos)
            .catch(() => null);
          if (!allVideos) return (app.innerHTML = '<div class="empty">Videos could not load. Try again in a minute.</div>');
        }
        app.innerHTML =
          (allVideos.length ? '<div class="player" id="player" hidden></div><div class="videos">' : '') +
            allVideos
              .map(
                (v, i) =>
                  `<div class="video" data-v="${i}"><img src="https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg" alt="" loading="lazy"><div><b>${esc(v.title)}</b><div class="meta">${esc(v.channel)} · ${when(v.date)}</div></div></div>`,
              )
              .join('') +
            (allVideos.length ? '</div>' : '') || '<div class="empty">No videos yet. Check back soon.</div>';
        app.querySelectorAll('[data-v]').forEach(
          (el) =>
            (el.onclick = () => {
              const v = allVideos[el.dataset.v];
              const player = document.getElementById('player');
              player.hidden = false;
              player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${esc(v.id)}?autoplay=1" title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
              player.scrollIntoView({ block: 'start' });
            }),
        );
      }

      // Posts | Notes switch inside Essays
      function subTabs(on) {
        return `<a class="btn ${on === 'posts' ? 'on' : ''}" href="/cities/essays" data-nav><b>Posts</b></a><a class="btn ${on === 'notes' ? 'on' : ''}" href="/cities/notes" data-nav><b>Notes</b></a><span style="width:10px"></span>`;
      }
      addEventListener('click', (e) => {
        const a = e.target.closest('[data-nav]');
        if (!a || e.metaKey || e.ctrlKey) return;
        e.preventDefault();
        go(a.getAttribute('href'));
      });
      const ago = (d) => {
        const m = Math.round((Date.now() - new Date(d)) / 60000);
        return m < 60 ? `${Math.max(1, m)}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : when(d);
      };
      const COLORS = ['#e6007e', '#0078d7', '#ff8c00', '#00a651', '#7b2fbe', '#d4145a', '#00897b'];
      const colorOf = (name) => COLORS[[...String(name)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % COLORS.length];
      // Note text is plain: escaped, with https links made clickable
      const linkify = (t) =>
        esc(t).replace(/https:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
      const isLong = (t) => t.length > 600 || t.split('\n').filter(Boolean).length > 10; // folded, with Read more
      let allNotes = null;
      let noteFilter = '';

      async function notes() {
        sectionTabs('essays');
        document.title = 'Notes · CITIES';
        if (!allNotes) {
          app.textContent = 'Loading...';
          try {
            allNotes = (await (await fetch('/api/blog/notes')).json()).notes;
          } catch {
            app.innerHTML = '<div class="empty">Notes could not load. Try again in a minute.</div>';
            return;
          }
        }
        const writers = [...new Set(allNotes.map((n) => n.author))];
        bar.innerHTML =
          subTabs('notes') +
          (writers.length > 1
            ? `<button class="btn ${noteFilter ? '' : 'on'}" data-w="">Everyone</button>` +
              writers.map((w) => `<button class="btn ${noteFilter === w ? 'on' : ''}" data-w="${esc(w)}">${esc(w)}</button>`).join('')
            : '');
        bar.querySelectorAll('[data-w]').forEach((b) => (b.onclick = () => ((noteFilter = b.dataset.w), notes())));
        const shown = allNotes.filter((n) => !noteFilter || n.author === noteFilter);
        app.innerHTML = `<div class="wall">${
          shown
            .map(
              (n) => `<div class="note">
                    <div class="hd" style="background:${colorOf(n.author)}">${n.avatar ? `<img src="${esc(n.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}<span>${esc(n.author)}<br><span style="font-weight:400;font-size:11px">${esc(n.publication)}</span></span><span class="ago" title="${esc(new Date(n.date).toLocaleString())}">${ago(n.date)}</span></div>
                    <div class="txt${isLong(n.body) ? ' long' : ''}">${n.body
                      .split(/\n{2,}/)
                      .map((p) => `<p>${linkify(p.trim())}</p>`)
                      .join('')}</div>${isLong(n.body) ? '<button class="btn more" style="margin:0 12px 8px">Read more</button>' : ''}
                    ${n.images.length ? `<div class="pics">${n.images.map((i) => `<img src="${esc(i)}" alt="" loading="lazy" referrerpolicy="no-referrer">`).join('')}</div>` : ''}
                    <div class="ft"><span>&#9829; ${n.likes}</span><span>&#8635; ${n.restacks}</span>${n.post ? `<a href="${esc(n.post.url)}" target="_blank" rel="noopener noreferrer">${esc(n.post.title || 'Linked post')}</a>` : ''}<a class="btn" href="${esc(n.external)}" target="_blank" rel="noopener noreferrer">Reply on Substack</a></div>
                  </div>`,
            )
            .join('') || '<div class="empty" style="max-width:620px;margin:0 auto">No notes yet. Check back soon.</div>'
        }</div>`;
        app.querySelectorAll('.more').forEach(
          (b) =>
            (b.onclick = () => {
              b.previousElementSibling.classList.remove('long');
              b.remove();
            }),
        );
      }

      async function route() {
        const path = location.pathname.split('/').slice(2).filter(Boolean).join('/');
        if (path === 'notes') return notes();
        if (path === 'videos') return videos();
        if (path.split('/')[0] === 'moodboard') return moodboard(path.split('/')[1]);
        if (path.startsWith('heart/')) return person(path.split('/')[1]);
        const section = path === '' ? 'heart' : ['heart', 'essays', 'field-notes'].includes(path) ? path : null;
        if (!section) return read(path);
        document.title = section === 'heart' ? 'CITIES' : `${SECTIONS.find(([k]) => k === section)[1]} · CITIES`;
        if (!all.length) {
          try {
            [all, people] = await Promise.all([
              fetch('/api/blog')
                .then((r) => r.json())
                .then((d) => d.posts),
              fetch('/api/blog/people')
                .then((r) => r.json())
                .then((d) => d.people),
            ]);
          } catch {
            app.innerHTML = '<div class="empty">CITIES could not load. Try again in a minute.</div>';
            return;
          }
        }
        list(section);
      }
      addEventListener('popstate', route);
      route();
      setInterval(async () => {
        // live: new posts show up while the page is open
        try {
          all = (await (await fetch('/api/blog')).json()).posts;
          const path = location.pathname.split('/').slice(2).filter(Boolean).join('/');
          if (['', 'heart', 'essays', 'field-notes'].includes(path)) list(path || 'heart');
        } catch {}
      }, 5 * 60_000);
    </script>
  </body>
</html>
