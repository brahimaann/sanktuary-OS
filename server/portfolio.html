<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio · Sanktuary</title>
    <style>
      /* The portfolio: made to be read on screen and to print (or save as PDF) cleanly for grant applications. */
      :root {
        --paper: #f7f4ee;
        --ink: #1b1a17;
        --dim: #5f5a51;
        --accent: #8a5a12;
        --line: #d9d2c4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          17px/1.6 Georgia,
          'Times New Roman',
          serif;
      }
      a {
        color: var(--accent);
      }
      .wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 40px 22px 70px;
      }
      header {
        border-bottom: 2px solid var(--ink);
        padding-bottom: 18px;
        margin-bottom: 28px;
      }
      h1 {
        font-size: clamp(40px, 7vw, 64px);
        line-height: 1.02;
        margin: 0;
        font-weight: 400;
      }
      .tagline {
        color: var(--dim);
        font-size: 20px;
        margin: 8px 0 0;
      }
      .contact {
        font:
          14px system-ui,
          sans-serif;
        color: var(--dim);
        margin-top: 12px;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      h2 {
        font:
          600 13px/1 system-ui,
          sans-serif;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 38px 0 14px;
      }
      .prose {
        white-space: pre-wrap;
        margin: 0;
      }
      .work {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 18px;
        padding: 16px 0;
        border-top: 1px solid var(--line);
        break-inside: avoid;
      }
      @media (max-width: 560px) {
        .work {
          grid-template-columns: 90px 1fr;
          gap: 12px;
        }
      }
      .work img,
      .ph {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        background: #e5ded0;
      }
      .work h3 {
        margin: 0;
        font-size: 22px;
        font-weight: 400;
      }
      .meta {
        font:
          13px system-ui,
          sans-serif;
        color: var(--dim);
        margin: 2px 0 8px;
      }
      .songs {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
        font-size: 15px;
      }
      .songs li {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 3px 0;
      }
      .songs button {
        font:
          12px system-ui,
          sans-serif;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 999px;
        padding: 2px 10px;
        cursor: pointer;
      }
      .credit {
        color: var(--dim);
        font-size: 13px;
      }
      .events li,
      .people li {
        padding: 5px 0;
        border-top: 1px solid var(--line);
        list-style: none;
      }
      .events,
      .people {
        padding: 0;
        margin: 0;
      }
      .when {
        display: inline-block;
        min-width: 130px;
        font:
          13px system-ui,
          sans-serif;
        color: var(--dim);
      }
      .print {
        position: fixed;
        right: 16px;
        bottom: 16px;
        font:
          600 14px system-ui,
          sans-serif;
        background: var(--ink);
        color: var(--paper);
        border: 0;
        padding: 11px 18px;
        border-radius: 999px;
        cursor: pointer;
      }
      .url {
        display: none;
      }
      .notice {
        color: var(--dim);
        text-align: center;
        padding: 60px 0;
      }
      @media print {
        body {
          background: #fff;
          font-size: 11.5pt;
        }
        .wrap {
          padding: 0;
          max-width: none;
        }
        .print,
        .songs button {
          display: none;
        }
        .url {
          display: inline;
          color: var(--dim);
          font:
            9pt system-ui,
            sans-serif;
        }
        a {
          color: var(--ink);
          text-decoration: none;
        }
        h2 {
          break-after: avoid;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="page"><p class="notice">Loading...</p></div>
    <button class="print" id="print" hidden>Save as PDF</button>
    <audio id="audio" preload="none"></audio>
    <script>
      (() => {
        const page = document.getElementById('page');
        const audio = document.getElementById('audio');
        const el = (tag, cls, text) => {
          const e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text) e.textContent = text; // always text, never HTML
          return e;
        };
        const day = (d) => new Date(`${d}T12:00:00`).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        const link = (href, text) => {
          const a = el('a', '', text);
          a.href = href;
          if (/^https?:/.test(href)) ((a.target = '_blank'), (a.rel = 'noopener noreferrer'));
          return a;
        };
        const printedUrl = (path) => el('span', 'url', ` ${location.origin.replace(/^https?:\/\//, '')}${path}`);

        fetch('/api/public/portfolio')
          .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
          .then(build)
          .catch(() => page.replaceChildren(el('p', 'notice', 'The portfolio is offline right now. Try again soon.')));

        function build(p) {
          document.title = `${p.name} · Portfolio`;
          page.replaceChildren();
          const head = el('header');
          head.append(el('h1', '', p.name));
          if (p.tagline) head.append(el('p', 'tagline', p.tagline));
          const contact = el('div', 'contact');
          if (p.contact)
            contact.append(
              /@/.test(p.contact) && !/\s/.test(p.contact) ? link(`mailto:${p.contact}`, p.contact) : el('span', '', p.contact),
            );
          contact.append(link(location.origin, location.host));
          p.links.forEach((u) => contact.append(link(u, u.replace(/^https:\/\/(www\.)?/, '').replace(/\/$/, ''))));
          head.append(contact);
          page.append(head);

          if (p.statement) page.append(el('h2', '', 'Artist statement'), el('p', 'prose', p.statement));
          if (p.bio) page.append(el('h2', '', 'Bio'), el('p', 'prose', p.bio));

          if (p.releases.length) {
            page.append(el('h2', '', 'Music'));
            p.releases.forEach((r) => {
              const w = el('div', 'work');
              if (r.cover) {
                const img = el('img');
                img.alt = `${r.title} cover`;
                img.src = `/api/public/release/${r.slug}/cover?w=400`;
                w.append(img);
              } else w.append(el('div', 'ph'));
              const t = el('div');
              const h = el('h3');
              h.append(link(`/release/${r.slug}`, r.title), printedUrl(`/release/${r.slug}`));
              t.append(
                h,
                el('div', 'meta', `${r.kind}${r.date ? ` · ${day(r.date)}` : ''}${r.story ? ` · visual story: ${r.story.title}` : ''}`),
              );
              if (r.blurb) t.append(el('p', 'prose', r.blurb));
              const songs = el('ul', 'songs');
              r.tracks.forEach((s) => {
                const li = el('li');
                if (s.preview) {
                  const b = el('button', '', 'Listen');
                  b.onclick = () => {
                    const src = `/api/public/release/${r.slug}/preview/${s.id}`;
                    if (audio.src.endsWith(src) && !audio.paused) return audio.pause();
                    document.querySelectorAll('.songs button').forEach((x) => (x.textContent = 'Listen'));
                    audio.src = src;
                    audio.play().then(
                      () => (b.textContent = 'Pause'),
                      () => {},
                    );
                  };
                  li.append(b);
                }
                li.append(el('span', '', `${s.n}. ${s.title}`));
                if (s.credits) li.append(el('span', 'credit', s.credits.split(/\r?\n/)[0].slice(0, 120)));
                songs.append(li);
              });
              if (r.tracks.length) t.append(songs);
              w.append(t);
              page.append(w);
            });
          }

          if (p.stories.length) {
            page.append(el('h2', '', 'Visual work'));
            p.stories.forEach((st) => {
              const w = el('div', 'work');
              const img = el('img');
              img.alt = '';
              img.src = `/api/public/story/${st.slug}/0?w=800`;
              img.onerror = () => img.replaceWith(el('div', 'ph'));
              const t = el('div');
              const h = el('h3');
              h.append(link(`/story/${st.slug}`, st.title), printedUrl(`/story/${st.slug}`));
              t.append(h, el('div', 'meta', `${st.subtitle ? `${st.subtitle} · ` : ''}${st.count} photographs and films`));
              w.append(img, t);
              page.append(w);
            });
          }

          const past = p.events.filter((e) => e.past);
          const next = p.events.filter((e) => !e.past).reverse();
          const eventList = (title, list) => {
            if (!list.length) return;
            const ul = el('ul', 'events');
            list.slice(0, 25).forEach((e) => {
              const li = el('li');
              li.append(el('span', 'when', day(e.start)), el('span', '', `${e.title} (${e.kind})${e.location ? `, ${e.location}` : ''}`));
              ul.append(li);
            });
            page.append(el('h2', '', title), ul);
          };
          eventList('Upcoming', next);
          eventList('Shows, shoots and releases', past);

          if (p.people.length) {
            const ul = el('ul', 'people');
            p.people.forEach((x) => {
              const li = el('li');
              li.append(el('span', 'when', x.displayName), el('span', '', x.role || ''));
              ul.append(li);
            });
            page.append(el('h2', '', 'Collaborators'), ul);
          }
          const pr = document.getElementById('print');
          pr.hidden = false;
          pr.onclick = () => print();
        }
      })();
    </script>
  </body>
</html>
