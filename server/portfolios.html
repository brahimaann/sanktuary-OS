<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolios · Sanktuary</title>
    <style>
      /* Member portfolios: the index of every live one, or one member's blocks in the order and sizes they set in
         Profile, as a masonry wall inside a Sanktuary (Win98) window. The frame is retro; the work inside is not. */
      :root,
      [data-theme='paper'] {
        --bg: #f7f4ee;
        --ink: #1b1a17;
        --dim: #6b655b;
        --accent: #8a5a12;
        --line: #e4ddd0;
        --card: #ffffff;
        --head: 400 clamp(36px, 6vw, 58px) / 1.02 Georgia, 'Times New Roman', serif;
        --title: 400 19px/1.25 Georgia, 'Times New Roman', serif;
        --body: 16px/1.6 Georgia, 'Times New Roman', serif;
      }
      [data-theme='night'] {
        --bg: #0b0b0f;
        --ink: #f3efe8;
        --dim: #b9b2a6;
        --accent: #d9a441;
        --line: #24242b;
        --card: #15151b;
      }
      [data-theme='bold'] {
        --bg: #ffffff;
        --ink: #0a0a0a;
        --dim: #5a5a5a;
        --accent: #e5484d;
        --line: #e6e6e6;
        --card: #f4f4f4;
        --head: 800 clamp(40px, 8vw, 78px) / 0.95 system-ui, sans-serif;
        --title: 700 17px/1.25 system-ui, sans-serif;
        --body: 15px/1.55 system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #008080; /* the Sanktuary desktop */
        padding: 18px;
        font:
          12px Tahoma,
          'MS Sans Serif',
          sans-serif;
      }
      a {
        color: var(--accent);
      }
      /* the window */
      .win {
        max-width: 1180px;
        margin: 0 auto;
        background: #c0c0c0;
        padding: 3px;
        box-shadow:
          inset -1px -1px #0a0a0a,
          inset 1px 1px #dfdfdf,
          inset -2px -2px #808080,
          inset 2px 2px #fff;
      }
      .titlebar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 4px 3px 6px;
        color: #fff;
        font-weight: 700;
        background: linear-gradient(90deg, #000080, #1084d0);
      }
      .titlebar span {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .titlebar i,
      .titlebar a {
        width: 16px;
        height: 14px;
        background: #c0c0c0;
        color: #000;
        font:
          700 10px/14px Tahoma,
          sans-serif;
        font-style: normal;
        text-align: center;
        text-decoration: none;
        box-shadow:
          inset -1px -1px #0a0a0a,
          inset 1px 1px #fff,
          inset -2px -2px #808080;
      }
      .menu {
        display: flex;
        gap: 14px;
        padding: 3px 6px;
        color: #000;
      }
      .menu a {
        color: #000;
        text-decoration: none;
      }
      .menu a:hover {
        background: #000080;
        color: #fff;
      }
      .screen {
        background: var(--bg);
        color: var(--ink);
        font: var(--body);
        padding: clamp(18px, 4vw, 44px);
        box-shadow:
          inset 1px 1px #808080,
          inset -1px -1px #fff;
        min-height: 60vh;
      }
      .status {
        display: flex;
        gap: 3px;
        margin-top: 3px;
        color: #000;
      }
      .status span {
        padding: 2px 6px;
        box-shadow:
          inset 1px 1px #808080,
          inset -1px -1px #fff;
      }
      .status span:first-child {
        flex: 1;
      }
      /* the header */
      header {
        display: flex;
        gap: 22px;
        align-items: flex-end;
        padding-bottom: 22px;
        margin-bottom: 26px;
        border-bottom: 1px solid var(--line);
      }
      header img {
        width: 108px;
        height: 108px;
        object-fit: cover;
        flex-shrink: 0;
      }
      h1 {
        font: var(--head);
        margin: 0;
      }
      .headline {
        color: var(--dim);
        font-size: 19px;
        margin: 8px 0 0;
      }
      .contact {
        font:
          13px system-ui,
          sans-serif;
        color: var(--dim);
        margin-top: 12px;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      /* the wall: equal columns, each block as tall as its content (spans set in script), wide ones span two */
      .wall {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        grid-auto-rows: 8px;
        gap: 0 16px;
      }
      .block {
        align-self: start;
        margin-bottom: 16px;
        background: var(--card);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .block.wide {
        grid-column: span 2;
      }
      @media (max-width: 560px) {
        .block.wide {
          grid-column: auto;
        }
        header {
          flex-direction: column;
          align-items: flex-start;
        }
      }
      .block img {
        display: block;
        width: 100%;
        height: auto;
      }
      .block.tall img {
        aspect-ratio: 3 / 4;
        object-fit: cover;
      }
      .block iframe {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 0;
        background: #000;
      }
      .block.tall iframe {
        aspect-ratio: 9 / 16;
      }
      .cap {
        padding: 12px 14px 14px;
      }
      .cap h3 {
        font: var(--title);
        margin: 0;
      }
      .cap p {
        margin: 6px 0 0;
        white-space: pre-wrap;
      }
      .kind {
        font:
          600 10px/1 system-ui,
          sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .small {
        font:
          12px system-ui,
          sans-serif;
        color: var(--dim);
      }
      .block.text .cap {
        padding: 18px 18px 20px;
      }
      .block.link a.cap {
        display: block;
        color: inherit;
        text-decoration: none;
      }
      .block.link:hover {
        border-color: var(--accent);
      }
      .rel {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 14px;
        border-top: 1px solid var(--line);
        color: inherit;
        text-decoration: none;
      }
      .rel h3 {
        font: var(--title);
        margin: 0;
      }
      .rel img {
        width: 56px;
        height: 56px;
        object-fit: cover;
        flex-shrink: 0;
      }
      /* the index */
      .card {
        display: block;
        color: var(--ink);
        text-decoration: none;
        border-top: 4px solid var(--c, var(--accent));
      }
      .card img,
      .card .ph {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        background: var(--line);
      }
      .bar {
        font:
          13px system-ui,
          sans-serif;
        background: #ffffe1;
        color: #000;
        border: 1px solid #808080;
        padding: 8px 12px;
        margin-bottom: 22px;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: space-between;
      }
      .bar a {
        color: #000080;
      }
      .notice {
        color: var(--dim);
        text-align: center;
        padding: 60px 0;
      }
    </style>
  </head>
  <body>
    <div class="win">
      <div class="titlebar"><span id="title">Portfolios</span><i>_</i><i>□</i><a href="/" title="Sanktuary">×</a></div>
      <div class="menu"><a href="/portfolios?all">All portfolios</a><a href="/portfolio">Sanktuary studio</a><a href="/">Sanktuary</a></div>
      <div class="screen" id="page"><p class="notice">Loading...</p></div>
      <div class="status"><span id="status">Ready</span><span>sanktuary.studio</span></div>
    </div>
    <script>
      (() => {
        const page = document.getElementById('page');
        const el = (tag, cls, text) => {
          const e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text) e.textContent = text; // always text, never HTML
          return e;
        };
        const link = (href, text, cls) => {
          const a = el('a', cls, text);
          a.href = href;
          if (/^https?:/.test(href)) ((a.target = '_blank'), (a.rel = 'noopener noreferrer'));
          return a;
        };
        const img = (src, alt = '') => {
          const i = el('img');
          i.src = src;
          i.alt = alt;
          i.loading = 'lazy';
          return i;
        };
        const day = (d) => new Date(`${d}T12:00:00`).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        const youtube = (u) => u.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/)([\w-]{11})/)?.[1];
        const LINKS = {
          spotify: 'Spotify',
          appleMusic: 'Apple Music',
          youtube: 'YouTube',
          soundcloud: 'SoundCloud',
          bandcamp: 'Bandcamp',
          audiomack: 'Audiomack',
          bandlab: 'BandLab',
          tiktok: 'TikTok',
          instagram: 'Instagram',
          x: 'X',
          website: 'Website',
        };
        const who = decodeURIComponent(location.pathname.split('/')[2] || '');
        const set = (title, status) => {
          document.getElementById('title').textContent = title;
          document.getElementById('status').textContent = status;
        };
        const offline = () => page.replaceChildren(el('p', 'notice', 'Portfolios are offline right now. Try again soon.'));

        // Masonry: each block spans as many 8px rows (+16px gap) as it is tall, and again when pictures load or
        // the window resizes
        const wall = () => {
          const w = el('div', 'wall');
          const fit = (b) => (b.style.gridRowEnd = `span ${Math.ceil((b.getBoundingClientRect().height + 16) / 8)}`);
          const ro = new ResizeObserver((es) => es.forEach((e) => fit(e.target)));
          w.add = (b) => (w.append(b), ro.observe(b));
          return w;
        };

        if (!who)
          fetch('/api/public/portfolios')
            .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
            .then(index, offline);
        else
          fetch(`/api/public/portfolios/${encodeURIComponent(who)}`)
            .then((r) => (r.status === 404 ? null : r.ok ? r.json() : Promise.reject(r.status)))
            .then(member, offline);

        function index({ people }) {
          set('Portfolios - Sanktuary', `${people.length} portfolio(s)`);
          page.replaceChildren();
          const head = el('header');
          const t = el('div');
          t.append(el('h1', '', 'Portfolios'), el('p', 'headline', 'The artists, producers and makers of Sanktuary.'));
          head.append(t);
          page.append(head);
          if (!people.length) return page.append(el('p', 'notice', 'No portfolios are live yet.'));
          const w = wall();
          page.append(w);
          people.forEach((p) => {
            const a = link(`/portfolios/${encodeURIComponent(p.username)}`, '', 'block card');
            if (p.accent) a.style.setProperty('--c', p.accent);
            const u = encodeURIComponent(p.username);
            a.append(
              p.photo ? img(`/api/public/avatar/${u}`) : p.cover ? img(`/api/public/portfolios/${u}/img/${p.cover}`) : el('div', 'ph'),
            );
            const cap = el('div', 'cap');
            cap.append(el('h3', '', p.displayName));
            if (p.headline || p.role) cap.append(el('p', 'small', p.headline || p.role));
            a.append(cap);
            w.add(a);
          });
        }

        function member(p) {
          page.replaceChildren();
          if (!p) {
            set('Not found', 'This portfolio isn’t live');
            return page.append(el('p', 'notice', 'This portfolio isn’t live.'));
          }
          document.title = `${p.displayName} · Portfolio`;
          set(`${p.displayName} - Portfolio`, p.mine && !p.live ? 'Preview: only you can see this' : `@${p.username}`);
          document.documentElement.dataset.theme = p.theme;
          if (p.accent) document.documentElement.style.setProperty('--accent', p.accent);

          if (p.mine) {
            const bar = el('div', 'bar');
            bar.append(
              el(
                'span',
                '',
                p.live
                  ? 'This is your portfolio as visitors see it. Move blocks around in Sanktuary > Profile > My portfolio.'
                  : 'Preview: only you can see this. Turn on "Live" in Sanktuary > Profile > My portfolio to publish it.',
              ),
            );
            page.append(bar);
          }

          const head = el('header');
          if (p.photo)
            head.append(
              img(
                p.mine && !p.live
                  ? `/api/profiles/${encodeURIComponent(p.username)}/photo`
                  : `/api/public/avatar/${encodeURIComponent(p.username)}`,
              ),
            );
          const t = el('div');
          t.append(el('h1', '', p.displayName));
          if (p.headline || p.role) t.append(el('p', 'headline', p.headline || p.role));
          const contact = el('div', 'contact');
          if (p.contact)
            contact.append(
              /@/.test(p.contact) && !/\s/.test(p.contact) ? link(`mailto:${p.contact}`, p.contact) : el('span', '', p.contact),
            );
          Object.entries(p.links).forEach(([k, u]) => contact.append(link(u, LINKS[k] || k)));
          t.append(contact);
          head.append(t);
          page.append(head);

          const w = wall();
          page.append(w);
          const caption = (b, kind, title, text) => {
            const cap = el('div', 'cap');
            if (kind) cap.append(el('div', 'kind', kind));
            if (title) cap.append(el('h3', '', title));
            if (text) cap.append(el('p', '', text));
            return cap;
          };
          p.blocks.forEach((b) => {
            const box = el('div', `block ${b.type} ${b.size}`);
            if (b.type === 'about') {
              if (!p.bio) return;
              box.append(caption(b, 'About', b.title, p.bio));
            } else if (b.type === 'music') {
              if (!p.releases.length) return;
              box.append(caption(b, 'Music', b.title));
              p.releases.forEach((r) => {
                const a = link(`/release/${r.slug}`, '', 'rel');
                a.append(r.cover ? img(`/api/public/release/${r.slug}/cover?w=400`, `${r.title} cover`) : el('span'));
                const t = el('span');
                t.append(el('h3', '', r.title), el('span', 'small', `${r.kind}${r.date ? ` · ${day(r.date)}` : ''}`));
                a.append(t);
                box.append(a);
              });
            } else if (b.type === 'photo') {
              if (!b.img) return;
              box.append(img(`/api/public/portfolios/${encodeURIComponent(p.username)}/img/${b.id}`, b.title));
              if (b.title || b.text) box.append(caption(b, '', b.title, b.text));
            } else if (b.type === 'video') {
              const id = b.url && youtube(b.url);
              if (!id) return;
              const f = el('iframe');
              f.src = `https://www.youtube-nocookie.com/embed/${id}`;
              f.title = b.title || 'Video';
              f.allow = 'encrypted-media; picture-in-picture; fullscreen';
              f.loading = 'lazy';
              box.append(f);
              if (b.title || b.text) box.append(caption(b, '', b.title, b.text));
            } else if (b.type === 'link') {
              if (!b.url) return;
              const a = link(b.url, '', 'cap');
              a.append(el('div', 'kind', b.url.replace(/^https:\/\/(www\.)?/, '').split('/')[0]), el('h3', '', `${b.title || b.url} ↗`));
              if (b.text) a.append(el('p', '', b.text));
              box.append(a);
            } else {
              if (!b.title && !b.text) return;
              box.append(caption(b, '', b.title, b.text));
            }
            w.add(box);
          });
          if (!w.children.length && p.mine) page.append(el('p', 'notice', 'Add some blocks in Profile > My portfolio.'));
        }
      })();
    </script>
  </body>
</html>
